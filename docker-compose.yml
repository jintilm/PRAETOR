# PRAETOR 独立部署栈。
#
# 与同机可能存在的其它栈完全隔离（多栈共存互不干扰）：
#   1. 顶层 name: praetor → 独立 compose 项目，不共享 network / 容器归属
#   2. 显式 container_name → praetor-pg / praetor-app，不会和旧容器重名
#   3. 独立命名卷 praetor-pgdata → 旧库数据物理隔离
#   4. 宿主端口默认 8797/8798（可用 PRAETOR_HTTP_PORT / PRAETOR_MCP_PORT 覆盖），
#      容器内监听 8787/8798（代理端口与宿主一致）
#
# 起停：
#   docker compose up -d --build
#   docker compose down          # 保留数据卷
#   docker compose down -v       # 连数据卷一起删（谨慎）
name: praetor

services:
  postgres:
    image: postgres:16-alpine
    container_name: praetor-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praetor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-praetor}
    volumes:
      - praetor-pgdata:/var/lib/postgresql/data
    ports:
      # 只为「在宿主机直接跑二进制」时用；容器间走内部网络，不经过这里。
      # 默认 55433：避开 PostgreSQL 默认的 5432 和测试栈的 55432，多套互不干扰。
      - "127.0.0.1:${PRAETOR_PG_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praetor} -d ${POSTGRES_DB:-praetor}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  praetor:
    # 镜像来源：**默认从本仓库源码构建**（见下面 build.target），装的永远是你 clone
    # 下来的这份代码——不会去 Docker Hub 拉某个人的预编译镜像。
    #
    # 想改用现成的发布镜像：在 .env 设 PRAETOR_IMAGE=<registry>/<repo>:<tag>，
    # 再 `docker compose pull praetor && docker compose up -d praetor`。
    # 设了 PRAETOR_IMAGE 后仍保留 build 段，但 compose 只在本地缺镜像时才构建。
    image: ${PRAETOR_IMAGE:-praetor/praetor:${PRAETOR_TAG:-local}}
    build:
      context: .
      dockerfile: Dockerfile
      # 源码构建目标：在镜像里编 Next + Go（宿主不需要 Node/Go）。
      # CI 发布用的是 runtime-with-binary（吃 release.yml 交叉编译的二进制）。
      target: runtime-with-source
      args:
        # 依赖源。内网 / 国内网络拉不动官方源时在 .env 里改这两个：
        #   PRAETOR_GOPROXY=https://goproxy.cn,direct
        #   PRAETOR_NPM_REGISTRY=https://registry.npmmirror.com
        GOPROXY: ${PRAETOR_GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${PRAETOR_NPM_REGISTRY:-https://registry.npmjs.org}
        # 应用容器里的 docker CLI 来源（见 Dockerfile 顶部）；官方源拉不动时换镜像地址
        DOCKER_CLI_IMAGE: ${PRAETOR_DOCKER_CLI_IMAGE:-docker:27-cli}
    container_name: praetor-app
    # 让容器能访问宿主上的代理 / 本地服务（如 http://host.docker.internal:7897）。
    # Docker Desktop 自带该域名，Linux 上靠 host-gateway 补上。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRAETOR_PG_DSN: postgres://${POSTGRES_USER:-praetor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praetor}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRAETOR_LLM_PROVIDER: ${PRAETOR_LLM_PROVIDER:-}
      PRAETOR_LLM_MODEL: ${PRAETOR_LLM_MODEL:-}
      PRAETOR_LLM_BASE_URL: ${PRAETOR_LLM_BASE_URL:-}
      PRAETOR_LLM_PROXY: ${PRAETOR_LLM_PROXY:-}
      # 沙箱默认 required：容器内没有 Docker socket 时必须显式设为 optional，
      # 否则 agent 的 Bash 会拒绝执行（P0-6 接入后生效）。
      PRAETOR_SANDBOX: ${PRAETOR_SANDBOX:-required}
      # per-task（默认）= 一任务一容器；shared = 常驻 praetor-sandbox
      PRAETOR_SANDBOX_ISOLATION: ${PRAETOR_SANDBOX_ISOLATION:-per-task}
      PRAETOR_SANDBOX_IMAGE: ${PRAETOR_SANDBOX_IMAGE:-praetor/sandbox:latest}
      PRAETOR_SANDBOX_CONTAINER: praetor-sandbox
      # 任务工作区根 —— 这是**应用容器内**看到的路径（os.MkdirAll / 文件工具用它），
      # 固定为 /app/data/work，与上面的数据挂载点配套，不要写成宿主路径。
      # `docker run -v` 需要的宿主源路径由程序在启动期 `docker inspect` 自身容器
      # 自动推导（见 sandbox/hostpath.go），因此这里不需要、也不应该填任何与机器
      # 相关的绝对路径：换台机器、换个 clone 目录、挪动仓库都能直接复跑。
      PRAETOR_SANDBOX_WORK_ROOT: /app/data/work
      # JWT 签名密钥目录：指向下面的命名卷，容器重建不换密钥（否则所有人被踢下线）。
      # 刻意不放 /app/data —— 沙箱工作区就在它下面，agent 能读到。
      PRAETOR_KEY_DIR: /app/keys
      # 逃生舱：只有 Docker daemon 不在本机（远程 DOCKER_HOST）等非常规布局才需要，
      # 填 daemon 能识别的宿主绝对路径。留空 = 自动推导。
      PRAETOR_SANDBOX_WORK_HOST_ROOT: ${PRAETOR_SANDBOX_WORK_HOST_ROOT:-}
      PRAETOR_SANDBOX_IDLE_TTL: ${PRAETOR_SANDBOX_IDLE_TTL:-30m}
      # ---- Android 真机接入（默认全关，不接手机时零影响）----
      # 录制代理在**容器内**的监听地址。默认只绑回环；真机 WiFi 代理要连进来时
      # 必须同时设 PRAETOR_TRAFFIC_ADDR=0.0.0.0:8798 与 PRAETOR_MOBILE_DEVICE_MODE=1，
      # 只设前者会被后端回落到回环并告警（见 cmd/praetor/main.go trafficAddrDefault）。
      PRAETOR_TRAFFIC_ADDR: ${PRAETOR_TRAFFIC_ADDR:-127.0.0.1:8798}
      PRAETOR_MOBILE_DEVICE_MODE: ${PRAETOR_MOBILE_DEVICE_MODE:-0}
      # adb server 跑在宿主（USB 边界留在宿主），容器里只连 TCP。
      PRAETOR_MOBILE_ADB_HOST: ${PRAETOR_MOBILE_ADB_HOST:-host.docker.internal}
      PRAETOR_MOBILE_ADB_PORT: ${PRAETOR_MOBILE_ADB_PORT:-5037}
      # 真机 IP / adb / frida 端口在全量出口透明层里的直连白名单，逗号分隔。
      PRAETOR_MOBILE_DEVICE_EXCLUDE: ${PRAETOR_MOBILE_DEVICE_EXCLUDE:-}
      # 授权模式：assume（默认）= 视为授权已获得，不要求任务级书面授权记录；
      # required = 必须签发任务级动态授权，否则 9 个 mobile_* 工具不注入。
      # assume 只解开「有没有授权记录」这一条，设备锁/命令白名单/取证边界/审计全保留。
      PRAETOR_MOBILE_AUTH_MODE: ${PRAETOR_MOBILE_AUTH_MODE:-assume}
      # assume 模式下的目标设备序列号（上游只把它存在授权记录里）；留空 = 不锁设备。
      PRAETOR_MOBILE_DEVICE_SERIAL: ${PRAETOR_MOBILE_DEVICE_SERIAL:-}
      # 宿主侧绑定也传进来，让 -check-config 的「宿主绑定」显示真实值而不是 compose 默认猜测
      PRAETOR_TRAFFIC_BIND: ${PRAETOR_TRAFFIC_BIND:-127.0.0.1}
    ports:
      - "${PRAETOR_HTTP_PORT:-8797}:8787"
      # 宿主侧绑定也默认回环：真机接入时设 PRAETOR_TRAFFIC_BIND=0.0.0.0，
      # 让手机能访问 <宿主IP>:<PRAETOR_MCP_PORT> 上的录制代理。
      - "${PRAETOR_TRAFFIC_BIND:-127.0.0.1}:${PRAETOR_MCP_PORT:-8798}:8798"
    volumes:
      # 数据目录（含 jwt.key 等）绑定到宿主机，方便查看/备份，容器重建不丢。
      # 与旧栈共用同一仓库目录时注意：两套栈不应同时指向同一个 data/。
      #
      # 必须是**宿主目录（bind mount）**，不要填 Docker 命名卷名：per-task 沙箱要把
      # 这个目录的子目录再挂进任务容器，命名卷没有「宿主路径」可供 -v 使用。
      # 相对路径由 compose 按本文件所在目录解析，程序会自动读回解析后的绝对路径。
      - ${PRAETOR_DATA_DIR:-./data}:/app/data
      # JWT 签名密钥单独放一个**命名卷**，不放 data 目录：沙箱工作区就在 data 下面，
      # 密钥放那儿等于让 agent 能读到它。之前 keyDir 默认等于 /app（镜像层，未挂载），
      # 每次 compose up --force-recreate 都重新生成密钥，浏览器会话全部失效。
      # 用命名卷而不是 bind mount：不需要宿主路径，可移植，且不落在沙箱可读范围内。
      - praetor-appkeys:/app/keys
      # 项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）：
      # 改 skill 无需重建镜像。
      - ./skills:/app/skills
      # ⚠️ 只有把 /var/run/docker.sock 挂进应用容器，容器内的 PRAETOR 才能 `docker exec`
      # 到 praetor-sandbox。但这等于把宿主 Docker 的控制权交给应用容器（≈root 权限）。
      # 默认注释掉，采用更安全的组合：**应用跑在宿主机（二进制），沙箱跑在容器里**。
      # 必须全容器化部署、且接受该风险时再打开：
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # 常驻工具沙箱：仅 PRAETOR_SANDBOX_ISOLATION=shared 时使用。
  # per-task 模式（默认）不依赖它，每个任务用同一镜像现场起容器。
  # 刻意限制：不给 privileged、不挂宿主根目录、不挂 docker.sock。
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: praetor/sandbox:${PRAETOR_TAG:-latest}
    container_name: praetor-sandbox
    command: ["sleep", "infinity"]
    working_dir: /work
    security_opt:
      - no-new-privileges:true
    volumes:
      # 任务工作目录：容器内 /work 与宿主 data/work 对应，产物可直接在宿主机查看
      - ${PRAETOR_WORK_DIR:-./data/work}:/work
    restart: unless-stopped

volumes:
  # ⚠️ name: 必须紧跟在自己的键下面。它把 Docker 卷名钉死成不带 compose 项目前缀的
  # 固定名字；若被别的键插在中间，本键就退化成「按项目名前缀解析」→ 换一个空卷挂载，
  # 表现为数据库"数据全没"（数据其实还在原卷里，只是挂错了）。
  praetor-pgdata:
    name: praetor-pgdata
  # JWT 签名密钥（jwt.key）。持久化后容器重建不会把所有人踢下线。
  praetor-appkeys:
    name: praetor-appkeys
